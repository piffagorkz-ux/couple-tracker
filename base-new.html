<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LOVIO - Для пар💕{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon-ios.svg') }}">
    <meta name="theme-color" content="#FF1493">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LOVIO">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-ios.svg') }}">
</head>
<body>
    {% if session.get('user_id') %}
    <nav class="navbar">
        <div class="navbar-brand">💕 LOVIO</div>
        <ul class="navbar-menu">
            <li><a href="{{ url_for('dashboard') }}">📱</a></li>
            <li><a href="{{ url_for('tree') }}">🌱</a></li>
            <li><a href="{{ url_for('diary') }}">📝</a></li>
            <li><a href="{{ url_for('mood') }}">😊</a></li>
            <li><a href="{{ url_for('goals') }}">🎯</a></li>
            <li><a href="{{ url_for('places') }}">🗺️</a></li>
            <li><a href="{{ url_for('dates') }}">💋</a></li>
            <li><a href="{{ url_for('habits') }}">💪</a></li>
            <li><a href="{{ url_for('wishes') }}">🎁</a></li>
            <li><a href="{{ url_for('confessions') }}">💌</a></li>
            <li><a href="{{ url_for('settings') }}">⚙️</a></li>
            <li><a href="{{ url_for('logout') }}" style="color: #FF1493;">Выход</a></li>
        </ul>
    </nav>
    {% endif %}

    <main style="padding: 2rem 1rem; max-width: 1200px; margin: 0 auto;">
        {% block content %}{% endblock %}
    </main>

    {% if session.get('user_id') %}
    <footer class="footer">
        <p>💕 Made with love for couples | LOVIO v4.0</p>
    </footer>
    {% endif %}

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

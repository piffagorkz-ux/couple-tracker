<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <style>
      .st0 { fill: #667eea; }
      .st1 { fill: #ffffff; }
    </style>
  </defs>
  
  <!-- Фон с закругленными углами (iOS стиль) -->
  <rect class="st0" width="180" height="180" rx="40" ry="40"/>
  
  <!-- Два сердца -->
  <!-- Левое сердце -->
  <path class="st1" d="M 45 70 C 45 60, 50 50, 60 50 C 70 50, 75 55, 75 65 C 75 80, 60 95, 45 105 C 30 95, 15 80, 15 65 C 15 55, 20 50, 30 50 C 40 50, 45 60, 45 70 Z" opacity="0.8"/>
  
  <!-- Правое сердце -->
  <path class="st1" d="M 135 70 C 135 60, 140 50, 150 50 C 160 50, 165 55, 165 65 C 165 80, 150 95, 135 105 C 120 95, 105 80, 105 65 C 105 55, 110 50, 120 50 C 130 50, 135 60, 135 70 Z" opacity="0.9"/>
  
  <!-- Соединяющая линия внизу -->

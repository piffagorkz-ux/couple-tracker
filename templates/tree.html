{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>🌱 {{ tree_name }}</h1>
    <p style="font-size: 3em; text-align: center;">🌱</p>
    <p>Здоровье: <strong>{{ health }}%</strong></p>
    <div style="background: #ddd; height: 20px; border-radius: 10px; margin: 1rem 0;">
        <div style="background: linear-gradient(135deg, #FF1493 0%, #667eea 100%); height: 20px; width: {{ health }}%; border-radius: 10px;"></div>
    </div>
    <button onclick="treeAction('water')" class="btn" style="margin: 0.5rem;">💧 Полить</button>
    <button onclick="treeAction('feed')" class="btn" style="margin: 0.5rem;">🍌 Накормить</button>
    <button onclick="treeAction('sing')" class="btn" style="margin: 0.5rem;">🎵 Спеть</button>
</div>
{% if actions %}
<div class="card">
    <h2>История:</h2>
    {% for a in actions %}
    <p>{{ a.action }} • {{ a.date }}</p>
    {% endfor %}
</div>
{% endif %}
<script>
async function treeAction(action) {
    const resp = await fetch('{{ url_for("tree_action") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action})
    });
    if (resp.ok) { alert('✅ Деревце счастливо!'); location.reload(); }
}
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVIO - Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {font-family: 'Montserrat', sans-serif; background: linear-gradient(135deg, #cd2a63 0%, #ef4284 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;}
        .card {background: white; border-radius: 20px; padding: 2.5rem; box-shadow: 0 20px 60px rgba(0,0,0,0.25); max-width: 400px; width: 100%;}
        h1 {text-align: center; font-size: 2.5em; color: #cd2a63; margin-bottom: 2rem;}
        .form-group {margin-bottom: 1.5rem;}
        .form-group label {display: block; margin-bottom: 0.5rem; color: #830418; font-weight: 600;}
        .form-group input, .form-group select {width: 100%; padding: 12px; border: 2px solid #98bc82; border-radius: 10px; font-size: 1em; font-family: 'Montserrat', sans-serif;}
        .gender-group {display: flex; gap: 1rem; margin-bottom: 1.5rem;}
        .gender-option {flex: 1;}
        .gender-option input {display: none;}
        .gender-option label {display: block; padding: 10px; background: white; border: 2px solid #98bc82; border-radius: 8px; text-align: center; cursor: pointer; font-weight: 600; transition: all 0.3s;}
        .gender-option input:checked + label {background: linear-gradient(135deg, #cd2a63 0%, #ef4284 100%); color: white; border-color: #cd2a63;}
        .btn {width: 100%; padding: 12px; background: linear-gradient(135deg, #cd2a63 0%, #ef4284 100%); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-family: 'Montserrat', sans-serif;}
        .btn:hover {transform: translateY(-3px);}
    </style>
</head>
<body>
    <div class="card">
        <h1>💕 LOVIO</h1>
        <form method="POST">
            <div class="form-group">
                <label>Выберите пол:</label>
                <div class="gender-group">
                    <div class="gender-option">
                        <input type="radio" id="female" name="gender" value="female" checked>
                        <label for="female">👩 Девушка</label>
                    </div>
                    <div class="gender-option">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">👨 Парень</label>
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label>Имя:</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Telegram ID:</label>
                <input type="number" name="user_id" required>
            </div>
            <button type="submit" class="btn">Войти 🚀</button>
        </form>
    </div>
</body>
</html>

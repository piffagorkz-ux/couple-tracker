<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVIO - Вход</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #cd2a63 0%, #ef4284 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(131, 4, 24, 0.25);
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            font-size: 2.5em;
            color: #cd2a63;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }
        .login-header p {
            color: #830418;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #830418;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #98bc82;
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Montserrat', sans-serif;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #cd2a63;
            box-shadow: 0 0 0 4px rgba(205, 42, 99, 0.1);
        }
        .form-group small {
            display: block;
            color: #830418;
            margin-top: 0.3rem;
            font-size: 0.9em;
            font-weight: 500;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #cd2a63;
        }
        .checkbox-group label {
            margin: 0;
            color: #830418;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #cd2a63 0%, #ef4284 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Montserrat', sans-serif;
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(205, 42, 99, 0.3);
        }
        .error-msg {
            background: #fce4e4;
            color: #c62828;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
            font-weight: 500;
            font-family: 'Montserrat', sans-serif;
        }
        .gender-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .gender-option {
            flex: 1;
        }
        .gender-option input {
            display: none;
        }
        .gender-option label {
            display: block;
            padding: 10px;
            background: white;
            border: 2px solid #98bc82;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        .gender-option input:checked + label {
            background: linear-gradient(135deg, #cd2a63 0%, #ef4284 100%);
            color: white;
            border-color: #cd2a63;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>💕 LOVIO</h1>
            <p>Приложение для пар</p>
        </div>
        
        <div class="error-msg" id="error"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label>Выберите ваш пол:</label>
                <div class="gender-group">
                    <div class="gender-option">
                        <input type="radio" id="female" name="gender" value="female" checked>
                        <label for="female">👩 Девушка</label>
                    </div>
                    <div class="gender-option">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">👨 Парень</label>
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" required placeholder="Напишите ваше имя">
            </div>
            
            <div class="form-group">
                <label for="user_id">Telegram ID</label>
                <input type="number" id="user_id" required placeholder="Например: 123456789">
                <small>💡 Найти ID: напишите @username_to_id_bot в Telegram</small>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="remember" checked>
                <label for="remember">Запомнить на этом устройстве</label>
            </div>
            
            <button type="submit" class="btn-login">Войти 🚀</button>
        </form>
    </div>

    <script>
        window.addEventListener('load', function() {
            const name = localStorage.getItem('lovio_name');
            const id = localStorage.getItem('lovio_id');
            const gender = localStorage.getItem('lovio_gender') || 'female';
            if (name && id) {
                document.getElementById('name').value = name;
                document.getElementById('user_id').value = id;
                document.getElementById(gender).checked = true;
            }
        });

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const user_id = document.getElementById('user_id').value.trim();
            const gender = document.querySelector('input[name="gender"]:checked').value;
            const remember = document.getElementById('remember').checked;
            
            if (!name || !user_id) {
                document.getElementById('error').textContent = 'Заполните все поля';
                document.getElementById('error').style.display = 'block';
                return;
            }
            
            if (remember) {
                localStorage.setItem('lovio_name', name);
                localStorage.setItem('lovio_id', user_id);
                localStorage.setItem('lovio_gender', gender);
            }
            
            const formData = new FormData();
            formData.append('name', name);
            formData.append('user_id', user_id);
            formData.append('gender', gender);
            
            const response = await fetch(window.location.pathname, {
                method: 'POST',
                body: formData
            });
            
            if (response.ok) {
                window.location.href = '/dashboard';
            } else {
                document.getElementById('error').textContent = 'Ошибка входа';
                document.getElementById('error').style.display = 'block';
            }
        });
    </script>
</body>
</html>

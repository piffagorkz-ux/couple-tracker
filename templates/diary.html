{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>📝 Дневник</h1>
    <textarea id="diary-text" placeholder="Напишите запись в дневник..." maxlength="1000"></textarea>
    <button onclick="addDiary()" class="btn">📝 Добавить</button>
</div>
{% if entries %}
<div class="card">
    {% for entry in entries|reverse %}
    <div style="background: #f5f5f5; padding: 1rem; margin: 1rem 0; border-radius: 8px;">
        <p>{{ entry.text }}</p>
        <small style="color: #999;">{{ entry.author }} • {{ entry.date }}</small>
    </div>
    {% endfor %}
</div>
{% endif %}
<script>
async function addDiary() {
    const text = document.getElementById('diary-text').value.trim();
    if (!text) return;
    const resp = await fetch('{{ url_for("diary_add") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({text})
    });
    if (resp.ok) { document.getElementById('diary-text').value = ''; alert('✅ Запись добавлена!'); location.reload(); }
}
</script>
{% endblock %}

{% extends "base.html" %}
{% block title %}Places - LOVIO{% endblock %}
{% block content %}
<div class="container">
    <h1>🗺️ Places</h1>
    <div class="card">
        <h2>Add a Place</h2>
        <form id="place-form">
            <input type="text" id="name" placeholder="Place name" required maxlength="200">
            <button type="submit" class="btn">Add Place</button>
        </form>
    </div>
    
    {% if places %}
    <h2 style="margin-top: 2rem;">Places to Visit</h2>
    {% for place in places %}
    <div class="card">
        <p><strong>{{ place.name }}</strong></p>
        {% if not place.visited %}
        <button onclick="visitPlace('{{ place.name }}')" class="btn" style="margin-top: 1rem; width: auto;">Mark as Visited</button>
        {% else %}
        <p style="color: #4caf50; margin-top: 1rem;">✓ Visited</p>
        {% endif %}
    </div>
    {% endfor %}
    {% endif %}
</div>

<script>
document.getElementById('place-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const response = await fetch('/api/places/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
    });
    const data = await response.json();
    if (response.ok) {
        alert('Place added! +2 XP');
        location.reload();
    } else {
        alert('Error: ' + data.error);
    }
});

async function visitPlace(name) {
    const response = await fetch('/api/places/visit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
    });
    if (response.ok) {
        alert('Place marked as visited! +10 XP');
        location.reload();
    }
}
</script>
{% endblock %}

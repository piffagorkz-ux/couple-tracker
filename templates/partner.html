{% extends "base.html" %}
{% block content %}
<div class="card">
    <h1>👥 Партнёр</h1>
    {% if partner_id %}
    <p>✅ Вы связаны с ID: {{ partner_id }}</p>
    {% else %}
    <input type="number" id="partner-id" placeholder="ID партнёра">
    <button onclick="setPartner()" class="btn">👥 Привязать</button>
    {% endif %}
</div>
<script>
async function setPartner() {
    const partner_id = document.getElementById('partner-id').value.trim();
    if (!partner_id) return;
    const resp = await fetch('{{ url_for("set_partner") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({partner_id})
    });
    if (resp.ok) { alert('✅ Партнёр привязан!'); location.reload(); }
}
</script>
{% endblock %}

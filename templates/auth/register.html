{% extends "base.html" %}

{% block title %}Register - LOVIO{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h1>Create Account</h1>
        <p style="color: #666; margin-bottom: 2rem;">Join LOVIO and celebrate your relationship</p>
        
        <form method="POST">
            {{ csrf_token() }}
            
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required minlength="3" maxlength="80"
                       placeholder="Choose your username">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required maxlength="120"
                       placeholder="your@email.com">
            </div>
            
            <div class="form-group">
                <label for="name">Display Name</label>
                <input type="text" id="name" name="name" required maxlength="120"
                       placeholder="How should we call you?">
            </div>
            
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender">
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                    <option value="other">Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required minlength="8"
                       placeholder="At least 8 characters">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required minlength="8"
                       placeholder="Repeat your password">
            </div>
            
            <button type="submit" class="btn">Create Account</button>
        </form>
        
        <p style="text-align: center; margin-top: 2rem; color: #666;">
            Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); font-weight: 600;">Log in</a>
        </p>
    </div>
</div>
{% endblock %}

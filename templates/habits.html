{% extends "base.html" %}
{% block title %}Habits - LOVIO{% endblock %}
{% block content %}
<div class="container">
    <h1>💪 Habits</h1>
    <div class="card">
        <h2>Create a Habit</h2>
        <form id="habit-form">
            <textarea id="text" placeholder="Describe the habit" required maxlength="300"></textarea>
            <button type="submit" class="btn">Create Habit</button>
        </form>
    </div>
    
    {% if habits %}
    <h2 style="margin-top: 2rem;">Your Habits</h2>
    {% for habit in habits %}
    <div class="card">
        <p><strong>{{ habit.text }}</strong></p>
        <p>🔥 Streak: {{ habit.streak }} days</p>
        <button onclick="completeHabit({{ habit.id }})" class="btn" style="width: auto; margin-top: 1rem;">Complete Today</button>
    </div>
    {% endfor %}
    {% endif %}
</div>

<script>
document.getElementById('habit-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = document.getElementById('text').value;
    const response = await fetch('/api/habits/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
    });
    const data = await response.json();
    if (response.ok) {
        alert('Habit created!');
        location.reload();
    } else {
        alert('Error: ' + data.error);
    }
});

async function completeHabit(habitId) {
    const response = await fetch(`/api/habits/complete/${habitId}`, { method: 'POST' });
    if (response.ok) {
        alert('Habit completed! +10 XP');
        location.reload();
    }
}
</script>
{% endblock %}

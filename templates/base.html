<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}LOVIO{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        {% if stats and stats.gender == 'male' %}
        :root {--p: #233a6e; --s: #d45468; --d: #5f789e; --l: #562c38;}
        {% else %}
        :root {--p: #E13D3C; --s: #ED6C72; --d: #6C0414; --l: #2C4054;}
        {% endif %}
        * {margin: 0; padding: 0; box-sizing: border-box;}
        html {scroll-behavior: smooth;}
        body {font-family: 'Montserrat', sans-serif; background: #fafbfc; color: var(--d); -webkit-font-smoothing: antialiased; font-size: 16px;}
        header {background: linear-gradient(135deg, var(--p) 0%, var(--s) 100%); color: white; padding: 1.2rem; text-align: center; box-shadow: 0 4px 12px rgba(225, 61, 60, 0.2);}
        header h1 {font-size: 1.8em; margin: 0;}
        main {max-width: 1200px; margin: 0 auto; padding: 1.5rem 1rem 100px 1rem;}
        .card {background: white; border-radius: 14px; padding: 1.8rem; margin-bottom: 1.5rem; box-shadow: 0 4px 12px rgba(108, 4, 20, 0.08); border: 1px solid rgba(214, 167, 179, 0.3); transition: all 0.3s;}
        .card:hover {box-shadow: 0 8px 24px rgba(225, 61, 60, 0.12); transform: translateY(-2px);}
        .btn {display: inline-block; padding: 12px 24px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; background: linear-gradient(135deg, var(--p) 0%, var(--s) 100%); color: white; text-decoration: none; transition: all 0.3s; font-family: 'Montserrat', sans-serif; font-size: 1em;}
        .btn:hover {transform: translateY(-3px); box-shadow: 0 8px 20px rgba(225, 61, 60, 0.3);}
        .btn:active {transform: translateY(-1px);}
        input, textarea, select {width: 100%; padding: 12px 14px; border: 2px solid rgba(214, 167, 179, 0.4); border-radius: 10px; font-family: 'Montserrat', sans-serif; margin-bottom: 1rem; font-size: 1em; line-height: 1.5;}
        input:focus, textarea:focus, select:focus {outline: none; border-color: var(--p); box-shadow: 0 0 0 4px rgba(225, 61, 60, 0.1);}
        h1 {color: var(--d); font-weight: 700; font-size: 1.8em; margin-bottom: 1.2rem;}
        h2 {color: var(--d); font-weight: 700; font-size: 1.3em; margin-bottom: 1rem;}
        
        /* Нижняя навигация */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 2px solid rgba(214, 167, 179, 0.3);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
            box-shadow: 0 -4px 12px rgba(225, 61, 60, 0.1);
        }
        
        nav.bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 0.5rem;
            text-decoration: none;
            color: var(--d);
            font-size: 0.75em;
            font-weight: 600;
            transition: all 0.2s;
            border-top: 3px solid transparent;
            position: relative;
        }
        
        nav.bottom-nav a:hover {
            color: var(--p);
            background: rgba(225, 61, 60, 0.05);
        }
        
        nav.bottom-nav a.active {
            color: var(--p);
            border-top-color: var(--p);
            background: rgba(225, 61, 60, 0.08);
        }
        
        nav.bottom-nav .icon {
            font-size: 1.5em;
            margin-bottom: 0.3rem;
        }
        
        .badge {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #4caf50;
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.65em;
        }
    </style>
</head>
<body>
    {% if session.get('user_id') %}
    <header>
        <h1>💕 LOVIO</h1>
    </header>
    {% endif %}
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    {% if session.get('user_id') %}
    <nav class="bottom-nav">
        <a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">
            <div class="icon">📱</div>
            <div>Главная</div>
        </a>
        <a href="/shop" class="{% if request.path == '/shop' %}active{% endif %}">
            <div class="icon">🛍️</div>
            <div>Магазин</div>
        </a>
        <a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">
            <div class="icon">⚙️</div>
            <div>Настройки</div>
        </a>
        <a href="#" onclick="alert('Вы вышли'); window.location.href='/logout'" style="color: #f44336;">
            <div class="icon">↗️</div>
            <div>Выход</div>
        </a>
        <a href="#" style="display: none;">
            <div class="icon">•</div>
        </a>
    </nav>
    {% endif %}
</body>
</html>

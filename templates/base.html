<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}LOVIO{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        {% if stats and stats.gender == 'male' %}
        :root {--p: #233a6e; --s: #d45468; --d: #5f789e; --l: #562c38;}
        {% else %}
        :root {--p: #E13D3C; --s: #ED6C72; --d: #6C0414; --l: #2C4054;}
        {% endif %}
        * {margin: 0; padding: 0; box-sizing: border-box;}
        html, body {height: 100%; width: 100%;}
        html {scroll-behavior: smooth;}
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #f5f5f7;
            color: var(--d);
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            font-size: 16px;
        }
        header {
            background: linear-gradient(135deg, var(--p) 0%, var(--s) 100%);
            color: white;
            padding: 1.5rem 1.2rem;
            text-align: center;
            box-shadow: 0 8px 32px rgba(225, 61, 60, 0.15);
            backdrop-filter: blur(20px);
        }
        header h1 {font-size: 2em; font-weight: 700; letter-spacing: -0.5px;}
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem 1.2rem 120px 1.2rem;
            min-height: calc(100vh - 200px);
        }
        .card {
            background: white;
            border-radius: 18px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            box-shadow: 0 12px 48px rgba(225, 61, 60, 0.15);
            transform: translateY(-4px);
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, var(--p) 0%, var(--s) 100%);
            color: white;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
            font-size: 1em;
            box-shadow: 0 4px 16px rgba(225, 61, 60, 0.2);
        }
        .btn:hover {transform: translateY(-2px); box-shadow: 0 8px 32px rgba(225, 61, 60, 0.3);}
        .btn:active {transform: scale(0.98);}
        input, textarea, select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e5e7;
            border-radius: 12px;
            font-family: inherit;
            margin-bottom: 1.2rem;
            font-size: 1em;
            line-height: 1.5;
            transition: all 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--p);
            box-shadow: 0 0 0 6px rgba(225, 61, 60, 0.08);
        }
        h1 {color: var(--d); font-weight: 700; font-size: 2em; margin-bottom: 1.5rem; letter-spacing: -0.5px;}
        h2 {color: var(--d); font-weight: 700; font-size: 1.5em; margin-bottom: 1.2rem; letter-spacing: -0.3px;}
        
        /* Premium Bottom Navigation */
        nav.bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0;
            z-index: 1000;
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.08);
        }
        
        nav.bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.8rem;
            text-decoration: none;
            color: #999;
            font-size: 0.8em;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border-top: 3px solid transparent;
        }
        
        nav.bottom-nav a .icon {
            font-size: 1.8em;
            margin-bottom: 0.4rem;
            display: block;
        }
        
        nav.bottom-nav a:hover {
            color: var(--p);
        }
        
        nav.bottom-nav a.active {
            color: var(--p);
            border-top-color: var(--p);
        }
        
        nav.bottom-nav a.active .icon {
            animation: bounce 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        @keyframes bounce {0%, 100% {transform: scale(1);} 50% {transform: scale(1.15);}}
        
        .badge {
            position: absolute;
            top: 0;
            right: 4px;
            background: #4caf50;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.7em;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.3);
        }
        
        @media (max-width: 768px) {
            main {padding: 1.2rem 0.8rem 100px 0.8rem;}
            header {padding: 1.2rem 1rem;}
            .card {padding: 1.5rem; margin-bottom: 1.2rem;}
            h1 {font-size: 1.6em;}
            h2 {font-size: 1.2em;}
        }
    </style>
</head>
<body>
    {% if session.get('user_id') %}
    <header>
        <h1>💕 LOVIO</h1>
    </header>
    {% endif %}
    
    <main>
        {% block content %}{% endblock %}
    </main>
    
    {% if session.get('user_id') %}
    <nav class="bottom-nav">
        <a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">
            <span class="icon">📱</span>
            Home
        </a>
        <a href="/shop" class="{% if request.path == '/shop' %}active{% endif %}">
            <span class="icon">🛍️</span>
            Shop
        </a>
        <a href="/settings" class="{% if request.path == '/settings' %}active{% endif %}">
            <span class="icon">⚙️</span>
            Settings
        </a>
        <a href="/logout" style="color: #ff3b30;">
            <span class="icon">↗️</span>
            Exit
        </a>
    </nav>
    {% endif %}
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LOVIO{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icon-ios.svg') }}">
    <meta name="theme-color" content="#e13d3c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LOVIO">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-ios.svg') }}">
</head>
<body>
    {% if session.get('user_id') %}
    <nav class="navbar">
        <div class="navbar-brand">💕 LOVIO</div>
        <div class="navbar-links">
            <a href="/dashboard">📱</a>
            <a href="/settings">⚙️</a>
            <a href="/logout" class="logout">Выход</a>
        </div>
    </nav>
    {% endif %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% if session.get('user_id') %}
    <footer>
        <p>💕 LOVIO v6.0 - Made with love for couples</p>
    </footer>
    {% endif %}

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVIO - Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #FF1493 0%, #667eea 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            font-size: 2.5em;
            color: #FF1493;
            margin-bottom: 0.5rem;
        }
        .login-header p {
            color: #999;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: 600;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }
        .form-group input:focus {
            outline: none;
            border-color: #FF1493;
        }
        .form-group small {
            display: block;
            color: #999;
            margin-top: 0.3rem;
            font-size: 0.9em;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-group label {
            margin: 0;
            color: #666;
            cursor: pointer;
            font-weight: 400;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #FF1493 0%, #667eea 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
        }
        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>💕 LOVIO</h1>
            <p>Приложение для пар</p>
        </div>
        
        <div class="error-msg" id="error"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" required placeholder="Напишите ваше имя">
            </div>
            
            <div class="form-group">
                <label for="user_id">Telegram ID</label>
                <input type="number" id="user_id" required placeholder="Например: 123456789">
                <small>💡 Найти ID: напишите @username_to_id_bot в Telegram</small>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="remember" checked>
                <label for="remember">Запомнить на этом устройстве</label>
            </div>
            
            <button type="submit" class="btn-login">Войти 🚀</button>
        </form>
    </div>

    <script>
        // Загружаем сохранённые данные
        window.addEventListener('load', function() {
            const name = localStorage.getItem('lovio_name');
            const id = localStorage.getItem('lovio_id');
            if (name && id) {
                document.getElementById('name').value = name;
                document.getElementById('user_id').value = id;
            }
        });

        // Отправка формы
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const user_id = document.getElementById('user_id').value.trim();
            const remember = document.getElementById('remember').checked;
            
            if (!name || !user_id) {
                document.getElementById('error').textContent = 'Заполните все поля';
                document.getElementById('error').style.display = 'block';
                return;
            }
            
            // Сохраняем в localStorage
            if (remember) {
                localStorage.setItem('lovio_name', name);
                localStorage.setItem('lovio_id', user_id);
            } else {
                localStorage.removeItem('lovio_name');
                localStorage.removeItem('lovio_id');
            }
            
            // Отправляем
            const formData = new FormData();
            formData.append('name', name);
            formData.append('user_id', user_id);
            
            const response = await fetch(window.location.pathname, {
                method: 'POST',
                body: formData
            });
            
            if (response.ok) {
                window.location.href = '/dashboard';
            } else {
                document.getElementById('error').textContent = 'Ошибка входа';
                document.getElementById('error').style.display = 'block';
            }
        });
    </script>
</body>
</html>

services:
  - type: web
    name: lovio-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lovio-db
          property: connectionString
      - key: REQUIRE_DATABASE_URL
        value: "1"

databases:
  - name: lovio-db
    plan: free
